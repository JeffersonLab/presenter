services:
  oracle:
    extends:
      file: deps.yaml
      service: oracle

  keycloak:
    extends:
      file: deps.yaml
      service: keycloak

  puppet:
    extends:
      file: deps.yaml
      service: puppet

  resize:
    extends:
      file: deps.yaml
      service: resize

  presenter:
    hostname: presenter
    ports:
      - "127.0.0.1:${PRESENTER_HTTPS_PORT:-8443}:8443"
      - "127.0.0.1:${PRESENTER_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${PRESENTER_MANAGEMENT_PORT:-9990}:9990"
    environment:
      # The browser reaches the app on the host's port
      FRONTEND_SERVER_URL: 'https://localhost:${PRESENTER_HTTPS_PORT:-8443}'
